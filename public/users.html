<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - użytkownicy</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="/">Strona główna</a>
            <a href="products.html">Produkty</a>
            <a href="users.html">Użytkownicy</a>
            <a href="orders.html">Zamówienia</a>
            <a href="admins.html" class="admin-only">Konta panelu</a>
        </div>
        <div class="nav-user">
            <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Zmień motyw">🌙</button>
            <span id="currentAdmin"></span>
            <a href="#" onclick="logout(); return false;">Wyloguj</a>
        </div>
    </nav>

    <h1>Użytkownicy</h1>

    <form id="form">
        <input type="hidden" id="id">
        <input type="text" id="name" placeholder="Imię i nazwisko" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Zapisz</button>
    </form>

    <div class="uzytkownicy" id="list">

    </div>

    <script src="auth.js"></script>
    <script>
        let isAdmin = true;

        async function loadRole(){
            const res = await fetch('/api/auth/me');
            const me = await res.json();
            isAdmin = me.role === 'admin';
            if(!isAdmin){
                document.getElementById('form').style.display = 'none';
            }
        }

        async function loadUsers(){
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('list');
            list.innerHTML = '';
            users.forEach(u => {
                list.innerHTML += `
                    <div class="uzytkownik">
                        <h3>${u.name}</h3>
                        <p>${u.email}</p>
                        <button onclick="show('${u._id}')">Pokaż</button>
                        ${isAdmin ? `<button onclick="edit('${u._id}')">Edytuj</button>
                        <button onclick="remove('${u._id}')">Usuń</button>` : ''}
                    </div>`;
            });
        }

        async function show(id){
            const res = await fetch('/api/users/' + id);
            const u = await res.json();
            alert(`Imię i nazwisko: ${u.name}\nEmail: ${u.email}`);
        }

        async function edit(id){
            const res = await fetch('/api/users/' + id);
            const u = await res.json();
            document.getElementById('id').value = u._id;
            document.getElementById('name').value = u.name;
            document.getElementById('email').value = u.email;
        }

        async function remove(id){
            await fetch('/api/users/' + id, {
                method: 'DELETE'
            });
            loadUsers();
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('id').value;
            const user = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };

            if(id){
                await fetch('/api/users/' + id, {
                    method: 'PUT',
                    headers:{
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user)
                });
            } else{
                await fetch('/api/users', {
                    method: 'POST',
                    headers:{
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user)
                });
            }

            document.getElementById('form').reset();
            document.getElementById('id').value = '';
            loadUsers();
        });

        async function start(){
            await loadRole();
            loadUsers();
        }

        start();
    </script>
</body>
</html>
